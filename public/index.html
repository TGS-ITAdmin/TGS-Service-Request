<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk — Ticketing System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    .fade-in { animation: fadeIn .15s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .tooltip { position: relative; }
    .tooltip .tip { visibility:hidden; opacity:0; position:absolute; bottom:125%; left:50%; transform:translateX(-50%);
      background:#1e293b; color:white; font-size:11px; white-space:nowrap; padding:4px 8px; border-radius:5px;
      transition:opacity .15s; pointer-events:none; z-index:99; }
    .tooltip:hover .tip { visibility:visible; opacity:1; }
    .star { cursor:pointer; font-size:28px; color:#d1d5db; transition:color .1s, transform .1s; }
    .star.on { color:#f59e0b; }
    .star:hover { transform:scale(1.15); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
<div id="app"></div>
<script>
// ─── API ─────────────────────────────────────────────────────────────────────
const API = {
  token: localStorage.getItem('hd_token') || null,
  setToken(t) { this.token = t; t ? localStorage.setItem('hd_token', t) : localStorage.removeItem('hd_token') },
  async req(method, path, body) {
    const res = await fetch('/api' + path, {
      method,
      headers: { 'Content-Type': 'application/json', ...(this.token ? { Authorization: 'Bearer ' + this.token } : {}) },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    })
    let data = null
    try { data = await res.json() } catch {}
    if (res.status === 401 && App.screen === 'app') { App.logout(); throw new Error('Session expired') }
    if (!res.ok) throw new Error(data?.error || data?.message || 'Request failed (' + res.status + ')')
    return data
  },
  get(p) { return this.req('GET', p) },
  post(p, b) { return this.req('POST', p, b) },
  patch(p, b) { return this.req('PATCH', p, b) },
  put(p, b) { return this.req('PUT', p, b) },
  del(p) { return this.req('DELETE', p) },
}

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const PERMS = {
  admin:   { manageUsers:true,  manageRoles:true,  manageDepts:true,  manageCategories:true,  manageRouting:true,  editTicket:true },
  manager: { manageUsers:false, manageRoles:false, manageDepts:false, manageCategories:false, manageRouting:false, editTicket:true },
  agent:   { manageUsers:false, manageRoles:false, manageDepts:false, manageCategories:false, manageRouting:false, editTicket:false },
  requestor: {},
}
function can(a) { return !!((PERMS[App.me?.role] || {})[a]) }
function isStaff() { return ['admin','manager','agent'].includes(App.me?.role) }
function roleColor(r) { return r==='admin'?'bg-purple-100 text-purple-700':r==='manager'?'bg-blue-100 text-blue-700':r==='agent'?'bg-gray-100 text-gray-600':'bg-teal-100 text-teal-700' }
function roleBadge(r) { return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${roleColor(r)}">${r}</span>` }

const SLA_HOURS = { urgent: 4, high: 24, medium: 72, low: 120 }
const FLAGS = {
  breached:  { level:'breached',  label:'SLA Breached', short:'Breached', icon:'🚨', cls:'bg-red-600 text-white',        bar:'bg-red-600' },
  critical:  { level:'critical',  label:'Critical',     short:'Critical', icon:'🔴', cls:'bg-red-100 text-red-700',       bar:'bg-red-400' },
  'at-risk': { level:'at-risk',   label:'At Risk',      short:'At Risk',  icon:'🟠', cls:'bg-orange-100 text-orange-700', bar:'bg-orange-400' },
  watch:     { level:'watch',     label:'Watch',        short:'Watch',    icon:'🟡', cls:'bg-yellow-100 text-yellow-700', bar:'bg-yellow-400' },
  'on-track':{ level:'on-track',  label:'On Track',     short:'On Track', icon:'🟢', cls:'bg-green-100 text-green-700',   bar:'bg-green-400' },
}
const STATUS = {
  open:        { label:'Open',        cls:'bg-blue-100 text-blue-700' },
  in_progress: { label:'In Progress', cls:'bg-yellow-100 text-yellow-700' },
  resolved:    { label:'Resolved',    cls:'bg-green-100 text-green-700' },
  closed:      { label:'Closed',      cls:'bg-gray-100 text-gray-600' },
}
const PRIORITY = {
  low:    { label:'↓ Low',    cls:'bg-gray-100 text-gray-600' },
  medium: { label:'→ Medium', cls:'bg-blue-100 text-blue-700' },
  high:   { label:'↑ High',   cls:'bg-orange-100 text-orange-700' },
  urgent: { label:'⚡ Urgent', cls:'bg-red-100 text-red-700' },
}
const COLORS = ['#3b82f6','#06b6d4','#10b981','#f59e0b','#8b5cf6','#ef4444','#ec4899','#64748b']

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function computeFlag(t) {
  if (t.status === 'resolved' || t.status === 'closed') return null
  const created = new Date(t.created_at)
  const slaMs = (SLA_HOURS[t.priority] || SLA_HOURS.medium) * 3600000
  const slaDL = new Date(created.getTime() + slaMs)
  const dueDL = t.due_date ? new Date(t.due_date + 'T23:59:59') : null
  const deadline = dueDL && dueDL < slaDL ? dueDL : slaDL
  const totalMs = deadline - created, remaining = deadline - new Date()
  const pct = remaining / totalMs
  if (remaining <= 0) return { ...FLAGS.breached, remaining, deadline }
  if (pct <= 0.25) return { ...FLAGS.critical, remaining, deadline }
  if (pct <= 0.50) return { ...FLAGS['at-risk'], remaining, deadline }
  if (pct <= 0.75) return { ...FLAGS.watch, remaining, deadline }
  return { ...FLAGS['on-track'], remaining, deadline }
}
function fmtRemaining(ms) {
  if (ms <= 0) return 'overdue'
  const h = Math.floor(ms / 3600000)
  if (h < 1) return Math.floor(ms/60000) + 'm left'
  if (h < 24) return h + 'h left'
  return Math.floor(h/24) + 'd ' + (h%24) + 'h left'
}
function flagBadge(t, compact=false) {
  const f = computeFlag(t)
  if (!f) return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs bg-gray-100 text-gray-400">✅ Done</span>'
  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium ${f.cls}">${f.icon} ${compact?f.short:f.label}</span>`
}
function slaBar(t) {
  const f = computeFlag(t); if (!f) return ''
  const created = new Date(t.created_at)
  const pctUsed = Math.min(100, Math.max(0, ((new Date() - created) / (f.deadline - created)) * 100))
  return `<div><div class="flex items-center justify-between text-xs mb-1">
    <span class="text-gray-500">SLA · ${SLA_HOURS[t.priority]}h for ${t.priority}</span>
    <span class="font-medium">${fmtRemaining(f.remaining)}</span></div>
    <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden"><div class="h-full rounded-full ${f.bar}" style="width:${pctUsed}%"></div></div></div>`
}
function fmt(iso) { if(!iso) return '—'; return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) }
function fmtDate(iso) { if(!iso) return '—'; return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) }
function timeAgo(iso) { const s=Math.floor((Date.now()-new Date(iso))/1000); if(s<60)return 'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago' }
function isOverdue(d,s) { if(!d||s==='resolved'||s==='closed')return false; return new Date(d+'T23:59:59')<new Date() }
function esc(s) { if(s==null)return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function badge(map,k) { const v=map[k]||map.open||map.medium; return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${v.cls}">${v.label}</span>` }
function avatar(name,color,size='sm') { const sz=size==='lg'?'w-10 h-10 text-sm':size==='md'?'w-8 h-8 text-xs':'w-7 h-7 text-xs'; const i=(name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); return `<div class="${sz} rounded-full flex items-center justify-center font-semibold text-white flex-shrink-0" style="background:${color||'#6366f1'}">${i}</div>` }
function stars(n) { return '★'.repeat(n) + '☆'.repeat(5-n) }
function spinner() { return '<div class="flex items-center justify-center h-40 text-gray-400 text-sm">Loading…</div>' }

// ─── APP ─────────────────────────────────────────────────────────────────────
const App = {
  screen: 'login',            // login | register | verify | app
  me: null,
  page: 'dashboard', selectedTicket: null, modal: null,
  data: { users: [], depts: [], routing: {}, tickets: [], detail: null, ratings: null, emails: [] },
  filters: { status:'',priority:'',dept:'',assignee:'',flag:'',search:'' },
  _peopleTab: 'people',
  authMsg: null, authErr: null, pendingEmail: null, emailPreviewUrl: null,
  ratingDraft: 0,

  async init() {
    if (API.token) {
      try {
        const { user } = await API.get('/auth/me')
        this.me = user
        this.screen = 'app'
        this.page = isStaff() ? 'dashboard' : 'mytickets'
        await this.loadAll()
      } catch { API.setToken(null); this.screen = 'login' }
    }
    this.render()
  },

  async loadAll() {
    const jobs = [API.get('/tickets').then(t => this.data.tickets = t), API.get('/departments').then(d => this.data.depts = d)]
    if (isStaff()) {
      jobs.push(API.get('/users').then(u => this.data.users = u))
      jobs.push(API.get('/departments/routing').then(r => this.data.routing = r))
    }
    await Promise.all(jobs)
  },

  async openTicket(id) {
    this.selectedTicket = id
    this.data.detail = null
    this.page = isStaff() ? 'tickets' : 'mytickets'
    this.render()
    this.data.detail = await API.get('/tickets/' + id)
    this.render()
    const sc = document.getElementById('msg-scroll'); if (sc) sc.scrollTop = sc.scrollHeight
  },

  async refresh() { await this.loadAll(); if (this.selectedTicket) this.data.detail = await API.get('/tickets/' + this.selectedTicket); this.render() },

  logout() { API.setToken(null); this.me = null; this.screen = 'login'; this.selectedTicket = null; this.authMsg = null; this.authErr = null; this.render() },
  go(page, id=null) { this.page = page; this.selectedTicket = id; this.data.detail = null; this.render() },
  openModal(name, data={}) { this.modal = { name, data }; this.render() },
  closeModal() { this.modal = null; this.render() },
  render() { document.getElementById('app').innerHTML = this.html(); this.bind() },

  html() {
    if (this.screen !== 'app') return this.authHtml()
    return `
      <div class="flex h-screen overflow-hidden">
        ${isStaff() ? this.staffSidebar() : this.requestorSidebar()}
        <main class="flex-1 overflow-hidden flex flex-col">
          ${this.selectedTicket ? this.ticketDetailPage()
            : this.page==='dashboard' ? this.dashboardPage()
            : this.page==='tickets' ? this.ticketListPage()
            : this.page==='mytickets' ? this.myTicketsPage()
            : this.page==='people' ? this.peoplePage()
            : this.page==='ratings' ? this.ratingsPage()
            : ''}
        </main>
      </div>
      ${this.modal ? this.modalHtml() : ''}
    `
  },

  // ─── AUTH SCREENS ──────────────────────────────────────────────────────────
  authHtml() {
    const shell = inner => `
      <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
        <div class="w-full max-w-md">
          <div class="text-center mb-8">
            <div class="text-5xl mb-2">🎫</div>
            <h1 class="text-2xl font-bold text-white">HelpDesk</h1>
            <p class="text-slate-400 text-sm">Ticketing System</p>
          </div>
          <div class="bg-white rounded-2xl shadow-xl p-8 fade-in">${inner}</div>
          <p class="text-center text-slate-500 text-xs mt-6">Demo staff login: admin@company.com / Admin@123</p>
        </div>
      </div>`
    const err = this.authErr ? `<div class="bg-red-50 text-red-700 border border-red-200 rounded-lg px-4 py-2.5 text-sm mb-4">${esc(this.authErr)}</div>` : ''
    const msg = this.authMsg ? `<div class="bg-green-50 text-green-700 border border-green-200 rounded-lg px-4 py-2.5 text-sm mb-4">${this.authMsg}</div>` : ''

    if (this.screen === 'register') return shell(`
      <h2 class="text-lg font-semibold mb-1">Create your account</h2>
      <p class="text-sm text-gray-400 mb-5">File and track support tickets.</p>
      ${err}
      <form id="register-form" class="space-y-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input name="name" required class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none" placeholder="Jane Doe"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input name="email" type="email" required class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none" placeholder="jane@example.com"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-gray-400 font-normal">(min 8 chars)</span></label>
          <input name="password" type="password" required minlength="8" class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none"></div>
        <button type="submit" id="auth-submit" class="w-full py-2.5 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">Create Account</button>
      </form>
      <p class="text-sm text-gray-500 text-center mt-5">Already have an account? <button data-screen="login" class="text-blue-600 font-medium hover:underline">Sign in</button></p>
    `)

    if (this.screen === 'verify') return shell(`
      <h2 class="text-lg font-semibold mb-1">Verify your email</h2>
      <p class="text-sm text-gray-400 mb-5">We sent a 6-digit code to <strong class="text-gray-600">${esc(this.pendingEmail)}</strong>.</p>
      ${err}${msg}
      ${this.emailPreviewUrl ? `<div class="bg-blue-50 border border-blue-200 rounded-lg px-4 py-3 text-sm text-blue-800 mb-4">📧 Test mode: <a href="${esc(this.emailPreviewUrl)}" target="_blank" class="font-medium underline">open the verification email</a> to see your code.</div>` : ''}
      <form id="verify-form" class="space-y-4">
        <input name="code" required maxlength="6" pattern="[0-9]{6}" class="block w-full rounded-lg border border-gray-300 px-3 py-3 text-center text-2xl tracking-[0.5em] font-mono focus:border-blue-500 focus:outline-none" placeholder="••••••" autocomplete="one-time-code">
        <button type="submit" id="auth-submit" class="w-full py-2.5 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">Verify & Sign In</button>
      </form>
      <div class="flex justify-between mt-5 text-sm">
        <button data-action="resend-code" class="text-blue-600 hover:underline">Resend code</button>
        <button data-screen="login" class="text-gray-400 hover:underline">Back to login</button>
      </div>
    `)

    return shell(`
      <h2 class="text-lg font-semibold mb-1">Welcome back</h2>
      <p class="text-sm text-gray-400 mb-5">Sign in to your account.</p>
      ${err}${msg}
      <form id="login-form" class="space-y-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input name="email" type="email" required class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none" placeholder="you@example.com"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input name="password" type="password" required class="block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:border-blue-500 focus:outline-none"></div>
        <button type="submit" id="auth-submit" class="w-full py-2.5 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">Sign In</button>
      </form>
      <p class="text-sm text-gray-500 text-center mt-5">New here? <button data-screen="register" class="text-blue-600 font-medium hover:underline">Create an account</button></p>
    `)
  },

  // ─── SIDEBARS ──────────────────────────────────────────────────────────────
  staffSidebar() {
    const u = this.me, depts = this.data.depts
    const dept = u.dept ? depts.find(d=>d.id===u.dept) : null
    const alert = this.data.tickets.filter(t=>{const f=computeFlag(t);return f&&f.level==='breached'}).length
    const nav = [
      {id:'dashboard',label:'Dashboard',icon:'⊞'},
      {id:'tickets',label:'Tickets',icon:'🎫'},
      {id:'people',label:'People',icon:'👥'},
      ...(u.role==='admin'?[{id:'ratings',label:'Ratings',icon:'⭐'}]:[]),
    ]
    return `
      <nav class="w-60 bg-slate-900 flex flex-col flex-shrink-0">
        <div class="px-5 py-5 border-b border-slate-800"><div class="flex items-center gap-2"><span class="text-2xl">🎫</span>
          <div><div class="text-white font-bold text-base leading-tight">HelpDesk</div><div class="text-slate-400 text-xs">Staff Console</div></div></div></div>
        <div class="flex-1 px-3 py-4 space-y-1">
          ${nav.map(n=>`<button data-nav="${n.id}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${this.page===n.id&&!this.selectedTicket?'bg-blue-600 text-white':'text-slate-400 hover:text-white hover:bg-slate-800'}">
            <span>${n.icon}</span>${n.label}
            ${n.id==='tickets'&&alert>0?`<span class="ml-auto bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 leading-none">${alert}</span>`:''}
          </button>`).join('')}
        </div>
        <div class="px-3 py-4 border-t border-slate-800">
          <button data-action="new-ticket" class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-500">＋ New Ticket</button>
        </div>
        <div class="px-4 py-3 border-t border-slate-800">
          <div class="flex items-center gap-2 mb-2">${avatar(u.name,u.color,'md')}
            <div class="min-w-0"><div class="text-white text-xs font-semibold truncate">${esc(u.name)}</div>
            <div class="flex items-center gap-1 mt-0.5">${roleBadge(u.role)}${dept?`<span class="text-slate-500 text-xs">· ${esc(dept.name)}</span>`:''}</div></div></div>
          <button data-action="logout" class="w-full text-slate-400 hover:text-white text-xs py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800">Sign out</button>
        </div>
      </nav>`
  },

  requestorSidebar() {
    const u = this.me
    return `
      <nav class="w-60 bg-slate-900 flex flex-col flex-shrink-0">
        <div class="px-5 py-5 border-b border-slate-800"><div class="flex items-center gap-2"><span class="text-2xl">🎫</span>
          <div><div class="text-white font-bold text-base leading-tight">HelpDesk</div><div class="text-slate-400 text-xs">Support Portal</div></div></div></div>
        <div class="flex-1 px-3 py-4 space-y-1">
          <button data-nav="mytickets" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium ${this.page==='mytickets'&&!this.selectedTicket?'bg-blue-600 text-white':'text-slate-400 hover:text-white hover:bg-slate-800'}">🎫 My Tickets</button>
        </div>
        <div class="px-3 py-4 border-t border-slate-800">
          <button data-action="new-ticket" class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-500">＋ File a Ticket</button>
        </div>
        <div class="px-4 py-3 border-t border-slate-800">
          <div class="flex items-center gap-2 mb-2">${avatar(u.name,u.color,'md')}
            <div class="min-w-0"><div class="text-white text-xs font-semibold truncate">${esc(u.name)}</div><div class="text-slate-500 text-xs truncate">${esc(u.email)}</div></div></div>
          <button data-action="logout" class="w-full text-slate-400 hover:text-white text-xs py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800">Sign out</button>
        </div>
      </nav>`
  },

  // ─── REQUESTOR: MY TICKETS ─────────────────────────────────────────────────
  myTicketsPage() {
    const tickets = this.data.tickets
    return `
      <div class="p-6 overflow-y-auto h-full fade-in">
        <div class="flex items-center justify-between mb-6">
          <div><h1 class="text-2xl font-bold text-gray-900">My Tickets</h1>
          <p class="text-sm text-gray-400 mt-0.5">${tickets.length} ticket${tickets.length!==1?'s':''} · track status, reply, and reopen if needed</p></div>
          <button data-action="new-ticket" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">＋ File a Ticket</button>
        </div>
        ${tickets.length===0?`<div class="flex flex-col items-center justify-center py-24 text-gray-400 bg-white rounded-xl border border-gray-200"><div class="text-5xl mb-3">🎫</div><p class="font-medium text-gray-500">No tickets yet</p><p class="text-sm mt-1">File your first ticket and we'll route it to the right team.</p></div>`
        :`<div class="space-y-3">
          ${tickets.map(t=>`
            <div data-ticket="${t.id}" class="bg-white rounded-xl border border-gray-200 shadow-sm p-5 hover:border-blue-300 hover:shadow cursor-pointer transition-all">
              <div class="flex items-start justify-between gap-4">
                <div class="min-w-0">
                  <div class="flex items-center gap-2 flex-wrap mb-1">
                    <span class="text-xs font-mono text-gray-400">#${t.num}</span>
                    ${badge(STATUS,t.status)} ${badge(PRIORITY,t.priority)}
                    ${t.category?`<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs bg-purple-50 text-purple-700">${esc(t.category)}</span>`:''}
                  </div>
                  <div class="font-semibold text-gray-900">${esc(t.title)}</div>
                  <div class="text-xs text-gray-400 mt-1">Filed ${timeAgo(t.created_at)} · updated ${timeAgo(t.updated_at)}</div>
                </div>
                <div class="flex flex-col items-end gap-2 flex-shrink-0">
                  ${t.status==='resolved'&&!t.rated?'<span class="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded-full font-medium">⭐ Rate your experience</span>':''}
                  ${t.status==='resolved'?'<span class="text-xs text-gray-400">Can be reopened</span>':''}
                  ${t.rated?'<span class="text-xs text-green-600">✓ Rated</span>':''}
                </div>
              </div>
            </div>`).join('')}
        </div>`}
      </div>`
  },

  // ─── STAFF: DASHBOARD ──────────────────────────────────────────────────────
